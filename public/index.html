<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Auto-Buy</title>
<style>
  :root { --bg:#f6f7f8; --card:#fff; --text:#1d2327; --muted:#69737b; --line:#e2e5e8; --accent:#0b7f86; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121416; --card:#1b1e21; --text:#e6e8ea; --muted:#99a2aa; --line:#2b2f33; --accent:#4fb8be; --bad:#f2827a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:11px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { padding:10px 14px; font-size:15px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:none; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .row { display:flex; align-items:center; gap:10px; }
  .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--bad); min-height:1.2em; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); padding:9px 4px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .item { padding:10px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .qty { width:56px; padding:8px; text-align:center; }
  .auto { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:6px; }
  .auto input { width:auto; }
  #log div { font-size:13px; padding:4px 0; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .hide { display:none; }
  button.confirm { background:#b8860b; }
  .msg { font-size:13px; margin-top:6px; }
  .msg.ok { color:var(--accent); }
  .msg.bad { color:var(--bad); }
  #qrView { text-align:center; }
  #qrView img { width:240px; height:240px; background:#fff; padding:8px; border-radius:8px; image-rendering:pixelated; }
  #qrClock { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; margin:6px 0; }
</style>
</head>
<body>
<main>
  <section id="loginView" class="hide">
    <h1>Mess Auto-Buy</h1>
    <form class="card" id="loginForm">
      <label for="reg">Registration / application number</label>
      <input id="reg" inputmode="numeric" autocomplete="username" maxlength="10" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" required>
      <label for="wpin">Wallet PIN (only if different from your login PIN)</label>
      <input id="wpin" type="password" inputmode="numeric" maxlength="6">
      <p class="err" id="loginErr"></p>
      <button id="loginBtn" style="width:100%">Sign in</button>
      <p class="muted">Signing in here closes any open Proodle session on your phone, the same as the official site does.</p>
    </form>
  </section>

  <section id="appView" class="hide">
    <div class="row" style="margin:8px 0 14px">
      <div class="grow"><h1 style="margin:0" id="who"></h1><div class="muted" id="bal"></div></div>
      <button class="ghost" id="logout">Sign out</button>
    </div>

    <div class="card hide" id="qrView">
      <strong id="qrTitle"></strong>
      <div class="muted" id="qrWho"></div>
      <p><img id="qrImg" alt="Order QR code"></p>
      <div id="qrClock"></div>
      <div class="muted" id="qrItems"></div>
      <p><button class="ghost" id="qrClose">Close</button></p>
    </div>

    <div class="tabs" id="tabs"></div>
    <p class="muted" id="times" style="margin:-4px 0 12px"></p>
    <div class="card">
      <div class="muted" id="menuNote"></div>
      <div id="menu"></div>
    </div>

    <div class="card">
      <div class="row"><strong class="grow">My orders</strong><button class="ghost" id="ordRefresh">Refresh</button></div>
      <div id="orders"></div>
    </div>

    <div class="card">
      <strong>Auto-buy</strong>
      <p class="muted" id="autoNote" style="margin:4px 0 0"></p>
      <div id="rules"></div>
    </div>

    <div class="card">
      <strong>Phone alerts</strong>
      <div id="alerts"></div>
    </div>

    <div class="card">
      <strong>Activity</strong>
      <div id="log"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let state = null, meal = Number(localStorage.getItem('meal') || 2), menuItems = [];

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  // a dropped connection on a read is retried once; POSTs (buy) never are
  const r = await fetch(path, opts).catch(e => body ? Promise.reject(e) : new Promise(ok => setTimeout(ok, 1000)).then(() => fetch(path, opts)))
    .catch(() => { throw new Error('Connection problem. Check your internet and try again.'); });
  const j = await r.json().catch(() => ({ error: 'Server not responding' }));
  if (r.status === 401) { show(false); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

function show(loggedIn) {
  $('loginView').classList.toggle('hide', loggedIn);
  $('appView').classList.toggle('hide', !loggedIn);
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    await api('/api/login', { reg: $('reg').value, pin: $('pin').value, wpin: $('wpin').value });
    $('pin').value = $('wpin').value = '';
    await load();
    loadOrders();
  } catch (err) { $('loginErr').textContent = err.message; }
  $('loginBtn').disabled = false;
};

// Two-tap confirm on the button itself (browser confirm() popups are blocked in some in-app browsers)
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  const orig = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = label;
  btn.classList.add('confirm');
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = orig; btn.classList.remove('confirm'); }, 4000);
  return false;
}

$('logout').onclick = async e => {
  if (!armed(e.target, 'Tap again to sign out')) return;
  await api('/api/forget', {});
  show(false);
};

let clock;
async function showQR(id) {
  $('qrView').classList.remove('hide');
  $('qrTitle').textContent = 'Loading QR...';
  $('qrWho').textContent = $('qrItems').textContent = '';
  $('qrImg').removeAttribute('src');
  $('qrImg').classList.add('hide');
  window.scrollTo(0, 0);
  try {
    const q = await api('/api/qr?id=' + encodeURIComponent(id));
    $('qrTitle').textContent = `${q.meal || ''}  ·  ${q.status || ''}`;
    $('qrWho').textContent = `${q.name || ''}  ·  ${q.reg || ''}  ·  ${q.date || ''}`;
    $('qrImg').src = 'data:image/png;base64,' + q.img;
    $('qrImg').classList.remove('hide');
    $('qrItems').textContent = q.items.map(i => `${i.qty} x ${i.name}  Rs ${i.total}`).join('   ·   ');
    clearInterval(clock);
    const tick = () => { $('qrClock').textContent = new Date().toLocaleString('en-GB'); };
    tick(); clock = setInterval(tick, 1000);
    return true;
  } catch (err) { $('qrTitle').textContent = err.message; return false; }
}
$('qrClose').onclick = () => { $('qrView').classList.add('hide'); clearInterval(clock); };

async function loadOrders() {
  $('orders').innerHTML = '<p class="muted">Loading...</p>';
  let list;
  try { list = await api('/api/orders'); }
  catch (err) { $('orders').innerHTML = ''; $('orders').append(Object.assign(document.createElement('p'), { className: 'msg bad', textContent: err.message })); return; }
  $('orders').innerHTML = list.length ? '' : '<p class="muted">No orders yet.</p>';
  for (const o of list) {
    const el = document.createElement('div');
    el.className = 'item row';
    el.innerHTML = '<div class="grow"><div class="n"></div><div class="muted i"></div></div>';
    el.querySelector('.n').textContent = `${o.meal}  ·  ${o.status}`;
    el.querySelector('.i').textContent = `Rs ${o.amount}  ·  ${o.date}  ·  #${o.id}`;
    if (o.qr) {
      const b = Object.assign(document.createElement('button'), { textContent: 'Show QR' });
      b.onclick = () => showQR(o.id);
      el.append(b);
    }
    $('orders').append(el);
  }
}
$('ordRefresh').onclick = () => loadOrders();

async function load() {
  state = await api('/api/state');
  show(true);
  $('who').textContent = state.name;
  $('bal').textContent = state.balance == null ? state.reg : `${state.reg}  ·  Wallet Rs ${state.balance.toFixed(2)}`;
  $('autoNote').textContent = `Checked every minute from 5:30 AM to 10:30 PM, and every 5 seconds around each meal's opening time, even when your phone and laptop are off. Each item is bought at most once a day.`;
  $('tabs').innerHTML = '';
  for (const [id, name] of Object.entries(state.meals)) {
    const b = document.createElement('button');
    b.textContent = name;
    b.className = Number(id) === meal ? 'on' : '';
    b.onclick = () => { meal = Number(id); localStorage.setItem('meal', meal); load(); };
    $('tabs').append(b);
  }
  const t12 = hm => { const [h, m] = hm.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  $('times').textContent = Object.entries(state.meals)
    .map(([id, name]) => state.times[id] ? `${name} ${t12(state.times[id].start)}–${t12(state.times[id].end)}` : `${name} (time not seen yet)`)
    .join('  ·  ');
  state.t12 = t12;
  renderRules();
  renderAlerts();
  $('log').innerHTML = '';
  for (const line of state.log.slice(0, 15)) {
    const d = document.createElement('div'); d.textContent = line; $('log').append(d);
  }
  if (!state.log.length) $('log').innerHTML = '<div class="muted">Nothing yet.</div>';
  loadMenu();
}
let menuSeq = 0;
async function loadMenu() {
  const seq = ++menuSeq;
  $('menuNote').textContent = 'Loading menu...';
  $('menu').innerHTML = '';
  try { menuItems = await api('/api/menu?meal=' + meal); }
  catch (err) { if (seq === menuSeq) $('menuNote').textContent = err.message; return; }
  if (seq !== menuSeq) return; // a newer tab was tapped meanwhile; only the latest one draws
  $('menu').innerHTML = '';
  const mname = state.meals[meal];
  $('menuNote').textContent = menuItems.length ? `Today's ${mname.toLowerCase()}`
    : `${mname} isn't open right now${state.times[meal] ? ` (it runs ${state.t12(state.times[meal].start)}–${state.t12(state.times[meal].end)})` : ''}. Proodle only lists each meal during its serving time. Turn on Phone alerts below to get a notification the moment it opens, then tick what you want. Ticked items are bought automatically every day after that, within seconds of opening.`;
  for (const it of menuItems) {
    const el = document.createElement('div');
    el.className = 'item';
    const ruled = state.rules.some(r => r.meal === meal && r.id === it.id);
    el.innerHTML = `
      <div class="row">
        <div class="grow"><div class="n"></div><div class="muted i"></div></div>
        <input class="qty" type="number" min="1" max="5" value="1" aria-label="Quantity">
        <button class="buy">Buy</button>
      </div>
      <div class="msg"></div>
      <label class="auto"><input type="checkbox" ${ruled ? 'checked' : ''}> Auto-buy when in stock</label>`;
    el.querySelector('.n').textContent = it.name;
    el.querySelector('.i').textContent = `Rs ${it.price.toFixed(2)}  ·  ${it.stock > 0 ? it.stock + ' in stock' : 'not ready yet'}${it.info ? '  ·  ' + it.info : ''}`;
    const buyBtn = el.querySelector('.buy'), qty = el.querySelector('.qty'), msg = el.querySelector('.msg');
    buyBtn.disabled = it.stock <= 0;
    buyBtn.onclick = async () => {
      const n = Math.max(1, Math.min(5, Number(qty.value) || 1));
      if (!armed(buyBtn, `Confirm Rs ${(n * it.price).toFixed(0)}`)) return;
      buyBtn.disabled = true;
      buyBtn.textContent = 'Buying...';
      msg.className = 'msg';
      msg.textContent = 'Placing order...';
      try {
        const r = await api('/api/buy', { meal, id: it.id, qty: n });
        msg.className = 'msg ok';
        msg.textContent = 'Order placed: ' + r.receipt;
        loadOrders();
        if (!(await showQR(r.order))) { // order list ids may differ from the order number: open the newest order instead
          const ids = (await api('/api/orders')).filter(o => o.qr).map(o => BigInt(o.id));
          if (ids.length) showQR(String(ids.reduce((a, b) => (b > a ? b : a))));
        }
        const s = await api('/api/state');
        $('bal').textContent = `${s.reg}  ·  Wallet Rs ${(s.balance || 0).toFixed(2)}`;
      } catch (err) {
        msg.className = 'msg bad';
        msg.textContent = err.message;
      }
      buyBtn.disabled = false;
      buyBtn.textContent = 'Buy';
    };
    el.querySelector('.auto input').onchange = e => {
      const rules = state.rules.filter(r => !(r.meal === meal && r.id === it.id));
      if (e.target.checked) rules.push({ meal, id: it.id, name: it.name, qty: Number(qty.value) || 1 });
      saveRules(rules);
    };
    $('menu').append(el);
  }
}

function renderAlerts() {
  const box = $('alerts');
  if (!state.alerts) {
    box.innerHTML = '<p class="muted">Get a notification on your phone when each meal opens, and whenever something is auto-bought. Free, no signup.</p><button id="alOn">Turn on</button>';
    $('alOn').onclick = () => setAlerts(true);
    return;
  }
  box.innerHTML = `<ol class="muted" style="padding-left:18px;margin:8px 0">
      <li>Install the free <b>ntfy</b> app: <a href="https://apps.apple.com/app/ntfy/id1625396347">iPhone</a> or <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy">Android</a>.</li>
      <li>Open it, tap <b>+</b>, and subscribe to this topic (keep it private):</li>
    </ol>
    <p><code id="alTopic" style="font-size:16px;user-select:all"></code> <button class="ghost" id="alCopy">Copy</button></p>
    <div class="row"><button class="ghost" id="alTest">Send test alert</button><button class="ghost" id="alOff">Turn off</button></div>
    <p class="msg" id="alMsg"></p>`;
  $('alTopic').textContent = state.alerts;
  $('alCopy').onclick = () => navigator.clipboard?.writeText(state.alerts).then(() => { $('alMsg').textContent = 'Copied.'; }, () => {});
  $('alTest').onclick = async () => { await setAlerts('test'); $('alMsg').textContent = 'Test sent. Did your phone get it?'; };
  $('alOff').onclick = e => { if (armed(e.target, 'Tap again to turn off')) setAlerts(false); };
}

async function setAlerts(on) {
  try { state.alerts = (await api('/api/alerts', { on })).alerts; } catch (err) { $('alerts').textContent = err.message; return; }
  renderAlerts();
}

function renderRules() {
  $('rules').innerHTML = state.rules.length ? '' : '<p class="muted">No auto-buy items. Tick "Auto-buy when in stock" on any menu item.</p>';
  for (const r of state.rules) {
    const el = document.createElement('div');
    el.className = 'item row';
    el.innerHTML = '<div class="grow"></div><button class="ghost">Remove</button>';
    el.firstChild.textContent = `${state.meals[r.meal]}: ${r.qty} x ${r.name}`;
    el.querySelector('button').onclick = () => saveRules(state.rules.filter(x => x !== r));
    $('rules').append(el);
  }
}

async function saveRules(rules) {
  try { await api('/api/rules', { rules }); } catch (err) { $('autoNote').textContent = err.message; }
  state = await api('/api/state');
  renderRules();
}

load().then(() => loadOrders()).catch(() => show(false));
</script>
</body>
</html>

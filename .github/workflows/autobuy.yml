name: autobuy

on:
  schedule:
    - cron: "*/5 0-16 * * *"   # every 5 min, 05:30-22:30 IST (cron is UTC)
  workflow_dispatch:

concurrency:
  group: autobuy
  cancel-in-progress: false   # one run at a time, so the same item is never bought twice

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Restore today's state (what was already bought, Proodle session)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check menu and buy
        run: python3 proodle.py actions
        env:
          PROODLE_REG: ${{ secrets.PROODLE_REG }}
          PROODLE_PIN: ${{ secrets.PROODLE_PIN }}
          PROODLE_WPIN: ${{ secrets.PROODLE_WPIN }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

name = "proodle-autobuy"
main = "worker.js"
compatibility_date = "2025-09-01"
assets = { directory = "public" }

# No cron: Proodle refuses requests that don't start from a device in India. /internal/tick does the checks.
[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "proodle"
database_id = "46527c98-0527-4216-8161-26fa0acdf625"
